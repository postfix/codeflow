name: macOS foundation

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  qualify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run tests/adapters.test.ts tests/cli-install.test.ts
